# Generated into Roommate.xcodeproj by XcodeGen – run ./bootstrap.sh
name: Roommate

options:
  bundleIdPrefix: com.presca
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    # Put your Apple Developer Team ID here (Xcode ▸ Settings ▸ Accounts),
    # or pick the team in Signing & Capabilities after generating.
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

# Shared by every target: the App Group, and the Family Controls
# (Screen Time) entitlement.
targetTemplates:
  ScreenTimeEntitled:
    entitlements:
      path: ${target_name}/${target_name}.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.presca.roommate

targets:
  Roommate:
    type: application
    platform: iOS
    templates: [ScreenTimeEntitled]
    sources:
      - path: Roommate
        excludes:
          - "Resources/**"
      # Folder reference: any font you drop into Resources/Fonts is bundled
      # on the next build, no need to regenerate the project.
      - path: Roommate/Resources
        type: folder
        buildPhase: resources
      - path: Shared
    entitlements:
      path: Roommate/Roommate.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.presca.roommate
        com.apple.developer.usernotifications.time-sensitive: true
    info:
      path: Roommate/Info.plist
      properties:
        CFBundleDisplayName: roommate
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Light
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.presca.roommate
            CFBundleURLSchemes: [roommate]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.presca.roommate
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: MonitorExtension
      - target: ShieldConfigurationExtension
      - target: ShieldActionExtension

  # Same app, no extensions, no entitlements – builds with a free
  # "Personal Team". She uses notifications instead of blocking apps.
  RoommateDemo:
    type: application
    platform: iOS
    sources:
      - path: Roommate
        excludes:
          - "Resources/**"
      - path: Roommate/Resources
        type: folder
        buildPhase: resources
      - path: Shared
    info:
      path: Roommate/Info-Demo.plist
      properties:
        CFBundleDisplayName: roommate demo
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Light
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.presca.roommate.demo
            CFBundleURLSchemes: [roommate]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.presca.roommate.demo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG DEMO
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEMO

  # Woken by iOS at bedtime / wake time / every 15 min of use.
  MonitorExtension:
    type: app-extension
    platform: iOS
    templates: [ScreenTimeEntitled]
    sources:
      - path: MonitorExtension
      - path: Shared
    info:
      path: MonitorExtension/Info.plist
      properties:
        CFBundleDisplayName: Roommate Monitor
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).DeviceActivityMonitorExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.presca.roommate.monitor

  # Draws her on top of a blocked app.
  ShieldConfigurationExtension:
    type: app-extension
    platform: iOS
    templates: [ScreenTimeEntitled]
    sources:
      - path: ShieldConfigurationExtension
      - path: Shared
    info:
      path: ShieldConfigurationExtension/Info.plist
      properties:
        CFBundleDisplayName: Roommate Shield
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.presca.roommate.shieldconfig

  # Handles the two buttons on that screen.
  ShieldActionExtension:
    type: app-extension
    platform: iOS
    templates: [ScreenTimeEntitled]
    sources:
      - path: ShieldActionExtension
      - path: Shared
    info:
      path: ShieldActionExtension/Info.plist
      properties:
        CFBundleDisplayName: Roommate Shield Actions
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldActionExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.presca.roommate.shieldaction

schemes:
  RoommateDemo:
    build:
      targets:
        RoommateDemo: all
    run:
      config: Debug
    archive:
      config: Release
  Roommate:
    build:
      targets:
        Roommate: all
    run:
      config: Debug
    archive:
      config: Release
